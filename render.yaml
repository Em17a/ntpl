services:
  - type: web
    name: nightplay
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: nightplay-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: nightplay-db
    plan: free
    region: singapore
